name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ synchronize, opened ]
  workflow_dispatch:

# Add concurrency to cancel in-progress jobs when a new commit is pushed to the PR
# This avoids CI jobs "stacking up" for the same PR
concurrency:
  # Cancel in-progress runs when a new workflow with the same concurrency group is queued
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENSTUDIO_VER: 3.9.0
  OPENSTUDIO_SHA: c77fbb9569
  OPENSTUDIO_PLATFORM: Ubuntu-22.04-x86_64
  OPENSTUDIO_EXT: deb
  OPENSTUDIO_URL: https://github.com/NREL/OpenStudio/releases/download/v3.9.0
  BUILDSTOCK_BRANCH: develop
  BUILDSTOCK_QUERY_BRANCH: main

jobs:
  format-files:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Format Files
        shell: bash
        run: |
          sed -i -e 's/[[:space:]]*$//' resources/options_lookup.tsv # Remove whitespace
          (sed -u 1q ; sort -k1 -k2) < resources/options_lookup.tsv > sorted_options_lookup.tsv
          mv sorted_options_lookup.tsv resources/options_lookup.tsv # Sort on first two columns

      - name: Check for changes in options_lookup.tsv
        shell: bash
        run: |
          # Stage the file to be checked
          git add resources/options_lookup.tsv
      
          # Check for any staged changes. --quiet makes git silent and faster.
          # The '!' inverts the exit code, so this block runs if there IS a difference.
          if ! git diff --cached --quiet; then
            echo "Error: 'resources/options_lookup.tsv' was modified by the formatting script."
            echo "Please run the formatting script locally, commit, and push the changes."
            exit 1
          else
            echo "'resources/options_lookup.tsv' is correctly formatted. No changes detected."
          fi

  format-files_commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Format Files
        shell: bash
        run: |
          sed -i -e 's/[[:space:]]*$//' resources/options_lookup.tsv # Remove whitespace
          (sed -u 1q ; sort -k1 -k2) < resources/options_lookup.tsv > sorted_options_lookup.tsv
          mv sorted_options_lookup.tsv resources/options_lookup.tsv # Sort on first two columns

      - name: Check for changes in options_lookup.tsv
        shell: bash
        run: |
          branch_name="${{ github.head_ref }}"
          git pull origin $branch_name
          git add resources/options_lookup.tsv
          git status
          if [[ $(git diff --cached --exit-code) ]]; then
            git config --global user.email "github-action@users.noreply.github.com"
            git config --global user.name "GitHub Action"
            git commit -m "Options lookup fix"
            echo "Pushing to branch: $branch_name"
            git push -u origin $branch_name
          fi
